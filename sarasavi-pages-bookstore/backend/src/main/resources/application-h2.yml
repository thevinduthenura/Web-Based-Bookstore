# ==============================================================================
# H2 Embedded Profile (h2) for Cloud (Render) & Instant Local Running
# ==============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sarasavi_db;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: false
