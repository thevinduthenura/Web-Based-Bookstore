spring:
  application:
    name: sarasavi-pages-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  main:
    allow-circular-references: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sarasavi_db;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  # ── Tier 2: MongoDB Mirror (Always active across all profiles) ─────────────
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://thevinduthenura222_db_user:1NX5bYz0ARrRNMCm@cluster0.runmnyo.mongodb.net/sarasavi_mirror?retryWrites=true&w=majority&appName=Cluster0}
      database: ${MONGO_DB:sarasavi_mirror}

sync:
  enabled: ${SYNC_ENABLED:true}
  interval-ms: ${SYNC_INTERVAL_MS:300000}
  inbound-interval-ms: ${SYNC_INBOUND_INTERVAL_MS:120000}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:sarasavi-pages-secret-key-2026-SE2030-B9G2-change-in-production-min-256bit}
  expiration-ms: 86400000  # 24 hours

# Springdoc / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# CORS — allow frontend (Next.js on Vercel or localhost:3000)
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://*.vercel.app}

logging:
  level:
    com.sarasavipages: DEBUG
    org.springframework.security: INFO
