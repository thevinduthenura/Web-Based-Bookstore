# ==============================================================================
# Microsoft SQL Server Profile (mssql)
# Sarasavi Pages Bookstore – Spring Boot Backend
# ==============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=sarasavi_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sarasavi}
    password: ${DB_PASSWORD:sarasavi123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  h2:
    console:
      enabled: false

  # ── Tier 2: MongoDB Mirror ────────────────────────────────────────────────
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://thevinduthenura222_db_user:1NX5bYz0ARrRNMCm@cluster0.runmnyo.mongodb.net/sarasavi_mirror?retryWrites=true&w=majority&appName=Cluster0}
      database: ${MONGO_DB:sarasavi_mirror}

# ── Backup & Sync Config ─────────────────────────────────────────────────────
backup:
  directory: ${BACKUP_DIR:./backups}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  cron: ${BACKUP_CRON:"0 0 2 * * ?"}   # Default: daily 02:00 AM

sync:
  enabled: ${SYNC_ENABLED:true}
  interval-ms: ${SYNC_INTERVAL_MS:300000}   # Default: every 5 minutes

