# ==============================================================================
# Render Blueprint Specification for Sarasavi Pages
# ==============================================================================
services:
  - type: web
    name: sarasavi-pages-backend
    env: docker
    dockerfilePath: sarasavi-pages-bookstore/backend/Dockerfile
    dockerContext: sarasavi-pages-bookstore/backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://*.vercel.app
      - key: JWT_SECRET
        generateValue: true
